<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>tvlog is offline</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #ededed;
        font-family: Arial, Helvetica, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }
      p {
        margin: 0.75rem 0 0;
        color: #9ca3af;
        font-size: 1rem;
      }
      button {
        margin-top: 2rem;
        border: 0;
        border-radius: 9999px;
        background: #fff;
        color: #000;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.75rem 2rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>tvlog</h1>
      <p>tvlog is offline. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
